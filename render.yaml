services:
  - type: web
    name: every-photobooth-backend
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: photobooth-images
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: FAL_KEY
        sync: false
      - key: FAL_MODEL
        value: fal-ai/nano-banana/edit
      - key: FAL_INPUT_WIDTH
        value: "512"
      - key: FAL_RESOLUTION
        value: 1K
      - key: FAL_THINKING_LEVEL
        value: minimal
      - key: FAL_TIMEOUT_MS
        value: 30000
      - key: DATA_DIR
        value: /opt/render/project/src/storage
      - key: ALLOWED_ORIGINS
        value: https://photobooth.lightboxlive.io,https://daveseidman.github.io
      - key: UPLOAD_MAX_MB
        value: 15

      - key: CONFERENCE_DATE
        value: "2026-11-05"
      - key: CONFERENCE_LOCATION
        value: in Brooklyn
      - key: PRINT_PREPARE_STRIPS
        value: "true"
      # On-site printing is configured in Render; keep tunnel credentials and
      # the enable switch intact when this Blueprint is synchronized.
      - key: PRINT_AUTO_SUBMIT
        sync: false
      - key: PRINT_SERVER_URL
        sync: false
      - key: PRINT_SERVER_TOKEN
        sync: false

      - key: LOCAL_FALLBACK_ENABLED
        value: "true"
      - key: AI_NORMAL_DURATION_MS
        value: "17000"
